name: OllaCraft CI & Benchmark

on:
  push:
    branches: [ main, "refactor/**", "feat/**", "fix/**", "perf/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    name: Unit, E2E Tests & Architecture Benchmark
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 171 automated unit & integration tests
        run: npm test

      - name: Run procedural engine benchmark
        run: npm run benchmark

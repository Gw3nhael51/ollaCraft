services:
  minecraft-server:
    image: itzg/minecraft-server
    container_name: mc-server
    restart: unless-stopped
    ports:
      - ${PORT}
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE" # Le réglage pour TLauncher
      TYPE: "PAPER" # Version optimisée du serveur
      VERSION: "1.20.4" # fige la version pour la stabilité du bot
      MEMORY: "4G"
      SPIGET_RESOURCES: "60192" # Installe automatiquement le plugin LoginSecurity
    volumes:
      - mc-data:/data

  bot:
    build: .
    container_name: ollacraft-bot
    profiles: ["bot"]
    network_mode: "host"
    env_file:
      - .env
    stdin_open: true
    tty: true

volumes:
  mc-data:
